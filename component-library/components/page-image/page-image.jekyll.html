{% assign c = "c-page-image" %}
{% assign image_name = include.image | split: '/' | last | downcase %}
{% assign is_poster = image_name contains 'poster' %}
<div class="container">
  <div class="row">
    <div class="col col-12">
      <div class="{{c}} animate{% if is_poster %} {{c}}--poster{% endif %}">
        <img loading="lazy" src="{{ include.image }}" alt="{{ include.image_alt }}">
      </div>
    </div>
  </div>
</div>
